<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoVault</title>
<style>
:root {
  --bg: #f5f6fa; --panel: #ffffff; --border: #e2e5ee; --text: #1a1e29; --muted: #5f677a;
  --accent: #3b5bdb; --accent-text: #ffffff; --ok: #0f8a57; --err: #c93636; --code: #eef0f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1015; --panel: #161921; --border: #262b37; --text: #e5e8ef; --muted: #8d95a8;
    --accent: #7d97ff; --accent-text: #0e1015; --ok: #3ecf8e; --err: #ff6e6e; --code: #0e1015;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap;
         padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; color: inherit; text-decoration: none; }
.brand span { color: var(--accent); }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 12px; }
p { margin: 0 0 12px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=password], input[type=file] {
  width: 100%; padding: 9px 12px; margin-bottom: 12px; font: inherit; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
button, .btn { display: inline-block; padding: 7px 13px; font: inherit; font-size: 14px; color: var(--text); text-decoration: none;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.danger { color: var(--err); }
.flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid; background: var(--panel); }
.flash.ok { color: var(--ok); border-color: var(--ok); }
.flash.error { color: var(--err); border-color: var(--err); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0 0 12px;
      white-space: pre-wrap; word-break: break-all; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
tr.bad td { color: var(--err); }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
.actions form { margin: 0; }
details { margin-top: 6px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
details form { margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--text); margin: 0 0 6px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">🔒 Crypto<span>Vault</span></a>
  {% block header %}{% endblock %}
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
